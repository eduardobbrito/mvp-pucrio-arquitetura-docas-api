# Sobe o MVP Docas completo: API (este repositório) + interface (repositório irmão).
# Pré-requisito: os dois repositórios clonados lado a lado na mesma pasta.
#
#   docker compose up --build
#
# Interface: http://localhost:3000 · API/Swagger: http://localhost:5000/openapi
services:
  api:
    build: .
    container_name: docas-api
    ports:
      - "5000:5000"
    environment:
      # Origem da interface autorizada no CORS
      FRONT_URL: http://localhost:3000
      # Banco fora da pasta do código, para o volume não esconder database/__init__.py
      URL_BANCO: sqlite:////app/dados/docas.sqlite3
    volumes:
      # Mantém o SQLite entre reinícios e rebuilds dos containers
      - docas-dados:/app/dados
    restart: unless-stopped

  front:
    build:
      context: ../mvp-pucrio-arquitetura-docas-front
      args:
        # A interface roda no navegador do usuário, que acessa a API pela porta publicada
        VITE_API_URL: http://localhost:5000
    container_name: docas-front
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  docas-dados:
